<script type="text/javascript">
  RED.nodes.registerType("profiler-report", {
    category: "system",
    color: "#FADBD8",
    defaults: {
      name: { value: "" },
      limit: { value: 20, validate: RED.validators.number() },
      sortBy: { value: "lastBytes" },
      kind: { value: "" },
      flowId: { value: "" },
      nodeId: { value: "" },
      nodeType: { value: "" },
      property: { value: "" },
      minBytes: { value: "", validate: RED.validators.number(true) },
      minDeltaBytes: { value: "", validate: RED.validators.number(true) },
      clearAfterRead: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-table",
    label: function () {
      return this.name || "profiler report";
    }
  });
</script>

<script type="text/html" data-template-name="profiler-report">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-limit"><i class="fa fa-list"></i> Limit</label>
    <input type="number" id="node-input-limit" min="1" step="1" style="width:100px;">
  </div>
  <div class="form-row">
    <label for="node-input-sortBy"><i class="fa fa-sort"></i> Sort by</label>
    <select id="node-input-sortBy" style="width:70%;">
      <option value="lastBytes">Last size</option>
      <option value="maxBytes">Max size</option>
      <option value="totalBytes">Total observed bytes</option>
      <option value="count">Sample count</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-kind"><i class="fa fa-filter"></i> Kind</label>
    <input type="text" id="node-input-kind" placeholder="payload,runtime-payload,context">
  </div>
  <div class="form-row">
    <label for="node-input-nodeType"><i class="fa fa-cube"></i> Node type</label>
    <input type="text" id="node-input-nodeType" placeholder="function">
  </div>
  <div class="form-row">
    <label for="node-input-property"><i class="fa fa-dot-circle-o"></i> Property</label>
    <input type="text" id="node-input-property" placeholder="payload.items">
  </div>
  <div class="form-row">
    <label for="node-input-flowId"><i class="fa fa-code-fork"></i> Flow id</label>
    <input type="text" id="node-input-flowId" placeholder="optional flow id">
  </div>
  <div class="form-row">
    <label for="node-input-nodeId"><i class="fa fa-tag"></i> Node id</label>
    <input type="text" id="node-input-nodeId" placeholder="optional node id">
  </div>
  <div class="form-row">
    <label for="node-input-minBytes"><i class="fa fa-database"></i> Min size</label>
    <input type="number" id="node-input-minBytes" min="0" step="1" style="width:120px;">
    <span>bytes</span>
  </div>
  <div class="form-row">
    <label for="node-input-minDeltaBytes"><i class="fa fa-line-chart"></i> Min delta</label>
    <input type="number" id="node-input-minDeltaBytes" min="0" step="1" style="width:120px;">
    <span>bytes</span>
  </div>
  <div class="form-row">
    <label for="node-input-clearAfterRead"><i class="fa fa-trash"></i> Clear</label>
    <input type="checkbox" id="node-input-clearAfterRead" style="display:inline-block; width:auto; vertical-align:top;">
    <span>Clear profiler records after reading</span>
  </div>
</script>

<script type="text/html" data-help-name="profiler-report">
  <p>Outputs the aggregated Heap Guardian profiler records from global context.</p>
  <p>Use this after <code>payload-profiler</code>, <code>context-profiler</code>, or <code>runtime-profiler</code> nodes have sampled traffic.</p>
  <p>The output includes analysis lists for top growers, payload keys, runtime expanders, and scored suspects.</p>
  <p>Node settings, HTTP query parameters, or <code>msg.profilerFilter</code> can filter by <code>kind</code>, <code>flowId</code>, <code>nodeId</code>, <code>nodeType</code>, <code>property</code>, <code>minBytes</code>, or <code>minDeltaBytes</code>.</p>
</script>
