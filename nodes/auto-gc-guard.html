<script type="text/javascript">
  RED.nodes.registerType("auto-gc-guard", {
    category: "system",
    color: "#F9E79F",
    defaults: {
      name: { value: "" },
      enabled: { value: false },
      requiredSeverity: { value: "critical" },
      threshold: { value: 85, validate: RED.validators.number(true) },
      cooldownSeconds: { value: 300, validate: RED.validators.number(true) },
      maxRunsPerHour: { value: 3, validate: RED.validators.number(true) },
      includeSpaces: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-shield",
    label: function () {
      return this.name || "auto gc guard";
    }
  });
</script>

<script type="text/html" data-template-name="auto-gc-guard">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-enabled"><i class="fa fa-power-off"></i> Enabled</label>
    <input type="checkbox" id="node-input-enabled" style="display:inline-block; width:auto; vertical-align:top;">
  </div>
  <div class="form-row">
    <label for="node-input-requiredSeverity"><i class="fa fa-warning"></i> Severity</label>
    <select id="node-input-requiredSeverity" style="width:70%;">
      <option value="critical">Critical only</option>
      <option value="warning">Warning or critical</option>
      <option value="info">Any alert</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-threshold"><i class="fa fa-tachometer"></i> Heap</label>
    <input type="number" id="node-input-threshold" min="0" step="1" style="width:90px;">
    <span>% threshold</span>
  </div>
  <div class="form-row">
    <label for="node-input-cooldownSeconds"><i class="fa fa-clock-o"></i> Cooldown</label>
    <input type="number" id="node-input-cooldownSeconds" min="0" step="1" style="width:100px;">
    <span>seconds</span>
  </div>
  <div class="form-row">
    <label for="node-input-maxRunsPerHour"><i class="fa fa-repeat"></i> Hour max</label>
    <input type="number" id="node-input-maxRunsPerHour" min="0" step="1" style="width:80px;">
  </div>
  <div class="form-row">
    <label for="node-input-includeSpaces"><i class="fa fa-cubes"></i> Spaces</label>
    <input type="checkbox" id="node-input-includeSpaces" style="display:inline-block; width:auto; vertical-align:top;">
  </div>
</script>

<script type="text/html" data-help-name="auto-gc-guard">
  <p>Optionally runs guarded GC when a profiler report contains qualifying alerts and heap pressure is above threshold.</p>
  <p>It is disabled by default. Enable it only after the alert thresholds match your environment.</p>
  <p>This node never runs in the background. It only evaluates when a message arrives, and it requires Node-RED to run with <code>--expose-gc</code>.</p>
  <p>Skipped and triggered decisions are written to <code>msg.heapGuardian.autoGc</code>.</p>
</script>
